<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalCircle - Patient Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loginpage.css') }}">
</head>
<body id="patient-login-page">
    <div class="container">
        <div class="welcome-panel">
            <h2>Welcome to VitalCircle Patient Portal</h2>
            <p>Take control of your health with AI-powered predictive health monitoring.</p>
        </div>
        <div class="form-panel">
            <div class="tabs">
                <div class="tab active" onclick="showForm('signin')">Sign In</div>
                <div class="tab" onclick="showForm('signup')">Sign Up</div>
            </div>
            <!-- Sign In Form -->
            <form id="signin-form" class="form active">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
                 <p class="error-message"></p>
            </form>
            <!-- Sign Up Form -->
            <form id="signup-form" class="form">
                <h2>Create Your Account</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Create Account</button>
                 <p class="error-message"></p>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/login_script.js') }}"></script>
</body>
</html>
