<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalCircle - Appointments</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/doc-dash.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-heartbeat logo-icon"></i><h2 class="logo-text">VitalCircle</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="{{ url_for('main.dashboard') }}"><i class="fas fa-th-large nav-icon"></i> <span class="nav-text">Dashboard</span></a></li>
            <li class="nav-item"><a href="{{ url_for('main.patients') }}"><i class="fas fa-users nav-icon"></i> <span class="nav-text">Patients</span></a></li>
            <li class="nav-item"><a href="{{ url_for('main.appointments') }}" class="active"><i class="fas fa-calendar-alt nav-icon"></i> <span class="nav-text">Appointments</span></a></li>
            <li class="nav-item"><a href="{{ url_for('main.reports') }}"><i class="fas fa-file-medical-alt nav-icon"></i> <span class="nav-text">Reports</span></a></li>
        </ul>
        <div class="sidebar-footer">
             <ul class="nav-menu">
                <li class="nav-item"><a href="#"><i class="fas fa-cog nav-icon"></i> <span class="nav-text">Settings</span></a></li>
                <li class="nav-item"><a href="#"><i class="fas fa-sign-out-alt nav-icon"></i> <span class="nav-text">Logout</span></a></li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
             <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
            <h1>Appointments</h1>
             <div class="header-actions">
                <div class="user-profile">
                    <img src="https://placehold.co/100x100/E6F0FA/1A4F8B?text=DC" alt="Dr. Chen" class="user-avatar">
                    <div class="user-info"><h4>Dr. Evelyn Chen</h4><p>Cardiologist</p></div>
                </div>
            </div>
        </header>

        <section class="appointments-panel">
            <div class="panel-header">
                <div class="tabs">
                    <a href="#" class="tab-link active" data-target="upcomingAppointments">Upcoming</a>
                    <a href="#" class="tab-link" data-target="pastAppointments">Past</a>
                </div>
                 <button class="btn-add-patient"><i class="fas fa-plus"></i> New Appointment</button>
            </div>
            
            <div id="upcomingAppointments" class="appointment-list-full">
                <!-- Upcoming appointments will be loaded here -->
            </div>
             <div id="pastAppointments" class="appointment-list-full" style="display: none;">
                <!-- Past appointments will be loaded here -->
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/doc-dash.js') }}"></script>
</body>
</html>
